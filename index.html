<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6df9c" />
  <title>Frutas · Beta 0.0.1</title>
  <link rel="stylesheet" href="./styles.css?v=0.0.1" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="panelButton" type="button" aria-label="Conectar painel">⚙️</button>
      <div class="score-card"><span>PONTOS</span><strong id="score">0</strong></div>
      <div class="next-card"><div class="next-fruit" id="nextFruit">🍇</div><span>PRÓXIMA</span></div>
    </header>
    <section class="game-wrap" aria-label="Jogo de frutas">
      <div class="danger-label">LIMITE</div><canvas id="gameCanvas"></canvas><div class="aim-line" id="aimLine"></div><div class="drop-preview" id="dropPreview">🍇</div><div class="game-message" id="gameMessage" hidden></div>
    </section>
    <section class="progression" aria-label="Evolução das frutas"><div class="progression-track" id="progressionTrack"></div><small>Junte 2 frutas iguais para evoluir</small></section>
    <footer class="statusbar"><span><i id="statusDot"></i><b id="panelStatus">Painel offline</b></span><span>Beta 0.0.1</span></footer>
  </main>
  <div class="modal" id="panelModal" aria-hidden="true"><div class="modal-card"><button class="close-button" id="closePanel" type="button">×</button><h2>Painel universal</h2><p>Digite o código de 8 caracteres gerado pelo Projeto Daniel.</p><input id="panelCode" maxlength="9" autocomplete="off" placeholder="ABCD-EFGH" /><button class="connect-button" id="connectPanel" type="button">Conectar</button><div class="pair-message" id="pairMessage">Aguardando conexão.</div><hr /><button class="secondary-button" id="restartButton" type="button">Reiniciar partida</button></div></div>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/wallissonghost-code/projeto-daniel@main/sdk/liveplus-game-sdk-v1.js"></script>
  <script src="./game.js?v=0.0.1"></script>
</body>
</html>
