name: Hardening unico Beta 0.0.20
on:
  push:
    paths:
      - '.github/workflows/core-cleanup-once.yml'
permissions:
  contents: write
jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcoes e limpeza
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          def rep(path,old,new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'padrao ausente: {path}')
              p.write_text(s.replace(old,new))
          rep('game.js',"scale:Number(b.__liveScale)||1,spawnedAt:b.spawnedAt","scale:1,spawnedAt:b.spawnedAt")
          p=Path('action-manager.js'); s=p.read_text()
          s=s.replace("const C=window.FRUTAS_CONFIG||{},SEEN_KEY=C.seenCommandsKey||'frutas-live-seen-v1',seen=new Map(),queues=new Map();","const C=window.FRUTAS_CONFIG||{},SEEN_KEY=C.seenCommandsKey||'frutas-live-seen-v1',seen=new Map(),processing=new Set(),queues=new Map();")
          old="async function run(data,executor){cleanup();const action=String(data?.action||data?.command||''),id=eventId(data);if(id&&seen.has(id))return{ok:true,duplicate:true};if(id){seen.set(id,Date.now());persist()}const mode=policy(action);if(mode!=='queue')return{ok:!!(await executor(data)),duplicate:false};const prev=queues.get(action)||Promise.resolve();const next=prev.catch(()=>{}).then(()=>executor(data));queues.set(action,next.finally(()=>{if(queues.get(action)===next)queues.delete(action)}));return{ok:!!(await next),duplicate:false}}"
          new="async function run(data,executor){cleanup();const action=String(data?.action||data?.command||''),id=eventId(data);if(id&&seen.has(id))return{ok:true,duplicate:true};if(id&&processing.has(id))return{ok:true,duplicate:true,processing:true};if(id)processing.add(id);const finish=ok=>{if(id)processing.delete(id);if(ok&&id){seen.set(id,Date.now());persist()}return{ok:!!ok,duplicate:false}};try{const mode=policy(action);if(mode!=='queue')return finish(await executor(data));const prev=queues.get(action)||Promise.resolve();const next=prev.catch(()=>{}).then(()=>executor(data));queues.set(action,next.finally(()=>{if(queues.get(action)===next)queues.delete(action)}));return finish(await next)}catch(err){if(id)processing.delete(id);throw err}}"
          if old not in s: raise SystemExit('run antigo ausente')
          s=s.replace(old,new).replace("function clear({persisted=false}={}){seen.clear();queues.clear();","function clear({persisted=false}={}){seen.clear();processing.clear();queues.clear();")
          p.write_text(s)
          p=Path('panel-bridge.js'); s=p.read_text()
          marker="function isAdmin(data={}){return data.admin===true||data.channel==='admin'}"
          if marker not in s: raise SystemExit('isAdmin ausente')
          s=s.replace(marker,marker+"\nfunction knownAction(data={}){const id=String(data.action||data.command||'');if(isAdmin(data))return (window.FrutasAutoPlayer?.adminTools||[]).some(a=>a.id===id);return (window.FrutasLiveActions?.actions||[]).some(a=>a.id===id)}")
          old="while(pendingCommands.length&&!gameProtected()){const item=pendingCommands[0];try{await executeCommand(item.data);pendingCommands.shift();saveQueue()}catch{saveQueue();flushTimer=setTimeout(flushPending,800);return}await new Promise(r=>setTimeout(r,120))}"
          new="while(pendingCommands.length&&!gameProtected()){const item=pendingCommands[0];if(!knownAction(item.data)){pendingCommands.shift();saveQueue();continue}try{const ok=await executeCommand(item.data);if(ok){pendingCommands.shift();saveQueue()}else{saveQueue();flushTimer=setTimeout(flushPending,800);return}}catch{saveQueue();flushTimer=setTimeout(flushPending,800);return}await new Promise(r=>setTimeout(r,120))}"
          if old not in s: raise SystemExit('flush antigo ausente')
          p.write_text(s.replace(old,new))
          test="const { test, expect } = require('@playwright/test');\nasync function boot(page){await page.goto('/?qa=resilience',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.FrutasGame&&window.FrutasLiveActions&&window.FrutasPanelBridge&&window.FrutasActionManager&&window.FrutasAutoPlayer,null,{timeout:15000})}\nasync function reset(page){await page.evaluate(()=>{FrutasAutoPlayer?.stop?.();return FrutasLiveActions.execute({action:'live_restart',params:{}})});await page.waitForTimeout(250)}\ntest('comando que falha nao vira duplicado',async({page})=>{await boot(page);await reset(page);const r=await page.evaluate(async()=>{const cmd={id:'retry-giant-1',action:'giant_fruit',params:{maxTier:2,duration:2}};const first=await FrutasLiveActions.execute(cmd);const g=FrutasGame,w=g.getFieldMetrics().width;g.dropFruit(0,w/2);await new Promise(r=>setTimeout(r,400));const second=await FrutasLiveActions.execute(cmd);return{first,second}});expect(r.first).toBeFalsy();expect(r.second).toBeTruthy()});\ntest('escala temporaria expirada nao fica permanente',async({page})=>{await boot(page);await reset(page);await page.evaluate(()=>{const g=FrutasGame,w=g.getFieldMetrics().width;g.dropFruit(0,w/2)});await page.waitForTimeout(400);await page.evaluate(()=>FrutasLiveActions.execute({action:'mini_fruits',params:{percent:50,duration:1}}));await page.waitForTimeout(900);await page.evaluate(()=>FrutasGame.saveGame());await page.waitForTimeout(1300);await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.FrutasLiveActions&&window.FrutasGame);await page.waitForTimeout(250);expect(await page.evaluate(()=>FrutasGame.getBodies()[0]?.__liveScale||0)).toBeCloseTo(1,1)});\ntest('fila persistida sobrevive ao reload',async({page})=>{await boot(page);await reset(page);const key=await page.evaluate(()=>FRUTAS_CONFIG.liveQueueKey);await page.evaluate(k=>localStorage.setItem(k,JSON.stringify({schema:1,savedAt:Date.now(),items:[{queuedAt:Date.now(),data:{id:'persist-1',action:'remove_points',params:{amount:10}}}]})),key);await page.reload({waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.FrutasPanelBridge);const pending=await page.evaluate(()=>FrutasPanelBridge.getPendingCommands());expect(pending.filter(x=>x.id==='persist-1')).toHaveLength(1)});\n"
          Path('tests/resilience.spec.js').write_text(test)
          pkg=json.loads(Path('package.json').read_text()); pkg['version']='0.0.20'; pkg['scripts']['test:quick']='playwright test tests/quick.spec.js tests/resilience.spec.js'; Path('package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          readme="# Frutas — Beta 0.0.20\n\nJogo de combinação de bolas com integração LIVE+.\n\n## Estrutura\n\n- `game.js`: física, tiers, pontuação e persistência da partida.\n- `input.js`: controles mobile/desktop.\n- `live-actions.js`: HUD e seis ações públicas da live.\n- `panel-bridge.js`: conexão LIVE+, regras e fila persistente.\n- `action-manager.js`: idempotência e políticas de execução.\n- `auto-player.js`: ferramenta administrativa isolada.\n- `lifecycle.js`: reset e ciclo de vida.\n- `tests/`: QA funcional, visual, resiliência e teste longo.\n\n## LIVE+ e persistência\n\nO HUD pode ser ligado/desligado e a preferência fica salva. Comandos recebidos em segundo plano entram em fila persistente com expiração e limite. IDs só são marcados como concluídos depois de execução bem-sucedida. Escalas temporárias não são persistidas pelo core; mini e Capybara restauram apenas enquanto o efeito ainda estiver válido.\n\n## QA\n\n`npm run test:quick` roda testes funcionais e de resiliência; `npm run test:visual` valida mobile; `npm run test:long` executa teste prolongado.\n"
          Path('README.md').write_text(readme)
          p=Path('config.js'); p.write_text(p.read_text().replace('Beta 0.0.19','Beta 0.0.20').replace("assetVersion:'0.0.19'","assetVersion:'0.0.20'"))
          p=Path('index.html'); p.write_text(p.read_text().replace('Beta 0.0.19','Beta 0.0.20').replace('?v=0.0.19','?v=0.0.20'))
          Path('version.json').write_text('{"version":"Beta 0.0.20","gameId":"frutas","core":"consolidated"}\n')
          Path('.github/workflows/core-cleanup-once.yml').unlink()
          PY
      - name: Validar sintaxe basica
        run: |
          node --check game.js
          node --check action-manager.js
          node --check panel-bridge.js
          node --check live-actions.js
          node --check tests/resilience.spec.js
          git diff --check
      - name: Commit Beta 0.0.20
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden LIVE persistence and release Beta 0.0.20"
          git push
