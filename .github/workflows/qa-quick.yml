name: QA rapido - Frutas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Rodar QA rapido
        run: npm run test:quick
      - name: Guardar relatorio em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frutas-qa-quick-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
